services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Configure RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rabbitmq-topology:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    environment:
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Configure RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD in .env}
    volumes:
      - ./rabbitmq/init.sh:/scripts/init.sh:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  ocr:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      RABBITMQ_URL: ${RABBITMQ_URL:-rabbitmq:5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Configure RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OCR_HTTP_PORT:-8080}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  rabbitmq_data:

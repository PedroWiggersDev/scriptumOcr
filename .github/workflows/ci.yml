name: CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Testes, build e SonarCloud
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.base_ref == 'develop') }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Executar testes unitários, cobertura e build Quarkus
        run: ./gradlew --no-daemon unitTest jacocoUnitTestReport quarkusBuild

      - name: Publicar relatórios de testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-cobertura
          if-no-files-found: ignore
          path: |
            build/reports/tests/unitTest/
            build/reports/jacoco/jacocoUnitTestReport/

      - name: Analisar e validar qualidade no SonarCloud
        if: ${{ github.event_name == 'push' || (env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '') }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.java.test.binaries=build/classes/java/test
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoUnitTestReport/jacocoUnitTestReport.xml
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true

  publicar-homologacao:
    name: Publicar imagem e implantar em homologação
    needs: validar
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Ler e validar versão SemVer
        run: |
          VERSION="$(cat VERSION)"
          if ! python3 - "$VERSION" <<'PY'
          import re
          import sys

          pattern = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          sys.exit(0 if re.fullmatch(pattern, sys.argv[1]) else 1)
          PY
          then
            echo "::error::VERSION não contém uma versão SemVer válida"
            exit 1
          fi
          echo "DOCKER_TAG_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"

      - name: Validar credenciais do Docker Hub e Render
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Configure o secret DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Configure o secret DOCKERHUB_TOKEN"; exit 1; }
          test -n "$RENDER_STAGING_DEPLOY_HOOK_URL" || { echo "::error::Configure o secret RENDER_STAGING_DEPLOY_HOOK_URL"; exit 1; }

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags da imagem
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/scriptum-ocr
          tags: |
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}-develop
            type=sha,prefix=sha-

      - name: Compilar e publicar imagem no Docker Hub
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Implantar imagem em homologação no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          IMAGE_URL="docker.io/${DOCKERHUB_USERNAME}/scriptum-ocr@${IMAGE_DIGEST}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --get --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"

  implantar-producao:
    name: Implantar versão publicada em produção
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar configuração e versão SemVer
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Configure o secret DOCKERHUB_USERNAME"; exit 1; }
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "::error::Configure o secret RENDER_PRODUCTION_DEPLOY_HOOK_URL"; exit 1; }
          VERSION="$(cat VERSION)"
          if ! python3 - "$VERSION" <<'PY'
          import re
          import sys

          pattern = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          sys.exit(0 if re.fullmatch(pattern, sys.argv[1]) else 1)
          PY
          then
            echo "::error::VERSION não contém uma versão SemVer válida"
            exit 1
          fi
          echo "DOCKER_TAG_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar se a imagem da versão já foi publicada
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Configure o secret DOCKERHUB_TOKEN"; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker buildx imagetools inspect \
            "docker.io/${DOCKERHUB_USERNAME}/scriptum-ocr:v${DOCKER_TAG_VERSION}" >/dev/null

      - name: Implantar versão no Render de produção
        run: |
          IMAGE_URL="docker.io/${DOCKERHUB_USERNAME}/scriptum-ocr:v${DOCKER_TAG_VERSION}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --get --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"
